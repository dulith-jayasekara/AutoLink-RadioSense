; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = .
default_envs = production

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; Production application
[env:production]
build_src_filter =
    +<src/main.cpp>
    +<src/Core/*.cpp>
    +<src/Hazard Memory Network/*.cpp>
    +<src/Multihop Routing & Relay/*.cpp>
    +<src/Route Aware Hazards Filtering/*.cpp>
    +<src/Store Carry Forward/*.cpp>
    -<test/>
    -<lib/>
    -<.pio/>
    -<.vscode/>

; Raw transmission test
[env:raw_tx]
build_src_filter =
    +<src/Core/*.cpp>
    +<test/system/1 - Raw Transmission/Raw_Transmission.cpp>
    -<src/main.cpp>

; Raw reception test
[env:raw_rx]
build_src_filter =
    +<src/Core/*.cpp>
    +<test/system/2 - Raw Reception/Raw_Reception.cpp>
    -<src/main.cpp>


; Combined transmission and reception test
[env:raw_tx_rx]
build_src_filter =
    +<src/Core/*.cpp>
    +<test/system/3 - Raw Transmission & Reception/Raw_Transmission_Reception.cpp>
    -<src/main.cpp>