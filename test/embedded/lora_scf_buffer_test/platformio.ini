[platformio]
default_envs = lora_scf_buffer_test

[env:lora_scf_buffer_test]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
extra_scripts = pre:extra_sources.py
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
lib_extra_dirs = ../../../lib
lib_deps = SPI
build_flags = -I"../../../src/Store Carry Forward"
