[platformio]
default_envs = scf_lifecycle_demo

[env:scf_lifecycle_demo]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
extra_scripts = pre:extra_sources.py
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
lib_extra_dirs = ../../../lib
lib_deps = SPI
build_flags = -I"../../../src/Store Carry Forward"
