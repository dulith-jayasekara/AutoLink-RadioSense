[platformio]
default_envs = beacon_compat_receiver

[env:beacon_compat_receiver]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../../lib
lib_deps = SPI
; Provisional: matches this branch's Core/LoRa_Manager.cpp.
; Confirm against teammate firmware before hardware testing.
build_flags = -DBEACON_CRC_ENABLED=1
